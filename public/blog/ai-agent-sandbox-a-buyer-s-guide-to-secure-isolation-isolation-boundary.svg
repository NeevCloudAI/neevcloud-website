<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
  <title>Diagram comparing the isolation boundary in a hardened container, gVisor, and a Firecracker or Kata microVM</title>
  <rect x="0" y="0" width="1200" height="620" fill="#000000"/>
  <text x="40" y="50" fill="#EAF4F4" font-size="26" font-weight="700">Where the isolation boundary sits</text>

  <!-- Column 1: Hardened Container -->
  <g>
    <text x="90" y="100" fill="#59D8A7" font-size="18" font-weight="700">HARDENED CONTAINER</text>
    <rect x="60" y="130" width="300" height="70" rx="6" fill="#384245" stroke="#6E7C83" stroke-width="1.5"/>
    <text x="210" y="170" fill="#EAF4F4" font-size="16" text-anchor="middle">Agent process</text>
    <rect x="60" y="215" width="300" height="60" rx="6" fill="none" stroke="#BEC9CC" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="210" y="250" fill="#BEC9CC" font-size="14" text-anchor="middle">seccomp + namespaces</text>
    <rect x="60" y="290" width="300" height="70" rx="6" fill="#515F66" stroke="#BEC9CC" stroke-width="2"/>
    <text x="210" y="322" fill="#EAF4F4" font-size="16" text-anchor="middle">Host kernel</text>
    <text x="210" y="344" fill="#A0ADB2" font-size="13" text-anchor="middle">shared with every tenant</text>
    <rect x="60" y="375" width="300" height="55" rx="6" fill="#000000" stroke="#515F66" stroke-width="1.5"/>
    <text x="210" y="408" fill="#A0ADB2" font-size="14" text-anchor="middle">Host hardware</text>
    <text x="210" y="465" fill="#BEC9CC" font-size="14" text-anchor="middle">Boundary: software filter,</text>
    <text x="210" y="485" fill="#BEC9CC" font-size="14" text-anchor="middle">kernel still shared</text>
  </g>

  <!-- Column 2: gVisor -->
  <g>
    <text x="450" y="100" fill="#59D8A7" font-size="18" font-weight="700">GVISOR</text>
    <rect x="420" y="130" width="300" height="70" rx="6" fill="#384245" stroke="#6E7C83" stroke-width="1.5"/>
    <text x="570" y="170" fill="#EAF4F4" font-size="16" text-anchor="middle">Agent process</text>
    <rect x="420" y="215" width="300" height="80" rx="6" fill="none" stroke="#00A78B" stroke-width="3"/>
    <text x="570" y="248" fill="#00A78B" font-size="14" text-anchor="middle" font-weight="700">Userspace kernel</text>
    <text x="570" y="268" fill="#00A78B" font-size="13" text-anchor="middle">intercepts every syscall</text>
    <rect x="420" y="310" width="300" height="60" rx="6" fill="#515F66" stroke="#6E7C83" stroke-width="1.5"/>
    <text x="570" y="345" fill="#EAF4F4" font-size="16" text-anchor="middle">Host kernel</text>
    <rect x="420" y="385" width="300" height="45" rx="6" fill="#000000" stroke="#515F66" stroke-width="1.5"/>
    <text x="570" y="412" fill="#A0ADB2" font-size="14" text-anchor="middle">Host hardware</text>
    <text x="570" y="465" fill="#BEC9CC" font-size="14" text-anchor="middle">Boundary: software kernel,</text>
    <text x="570" y="485" fill="#BEC9CC" font-size="14" text-anchor="middle">no raw syscalls reach host</text>
  </g>

  <!-- Column 3: Firecracker or Kata microVM -->
  <g>
    <text x="800" y="100" fill="#59D8A7" font-size="18" font-weight="700">FIRECRACKER / KATA MICROVM</text>
    <rect x="780" y="130" width="340" height="70" rx="6" fill="#384245" stroke="#6E7C83" stroke-width="1.5"/>
    <text x="950" y="170" fill="#EAF4F4" font-size="16" text-anchor="middle">Agent process</text>
    <rect x="780" y="215" width="340" height="60" rx="6" fill="#005150" stroke="#59D8A7" stroke-width="1.5"/>
    <text x="950" y="250" fill="#EAF4F4" font-size="15" text-anchor="middle">Dedicated guest kernel</text>
    <rect x="780" y="290" width="340" height="70" rx="6" fill="none" stroke="#59D8A7" stroke-width="4"/>
    <text x="950" y="322" fill="#59D8A7" font-size="15" text-anchor="middle" font-weight="700">KVM hardware boundary</text>
    <text x="950" y="344" fill="#59D8A7" font-size="13" text-anchor="middle">5 emulated devices only</text>
    <rect x="780" y="375" width="340" height="55" rx="6" fill="#000000" stroke="#515F66" stroke-width="1.5"/>
    <text x="950" y="408" fill="#A0ADB2" font-size="14" text-anchor="middle">Host hardware</text>
    <text x="950" y="465" fill="#BEC9CC" font-size="14" text-anchor="middle">Boundary: hardware-enforced,</text>
    <text x="950" y="485" fill="#BEC9CC" font-size="14" text-anchor="middle">separate kernel per agent</text>
  </g>

  <text x="40" y="560" fill="#6E7C83" font-size="13">Isolation strength increases left to right: shared kernel, then a software kernel boundary, then a hardware-enforced KVM boundary.</text>
</svg>
