apiVersion: v1
kind: ServiceAccount
metadata:
  name: neevcloud-website
  namespace: neevai-system
  labels:
    app: neevcloud-website
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neevcloud-website
  namespace: neevai-system
  labels:
    app: neevcloud-website
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neevcloud-website
      environment: dev
  template:
    metadata:
      labels:
        app: neevcloud-website
        environment: dev
    spec:
      serviceAccountName: neevcloud-website
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: neevcloud-website
          image: harbor.neev.work/test-template/neevcloud-website:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: neevcloud-website-service
  namespace: neevai-system
  labels:
    app: neevcloud-website
    environment: dev
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: neevcloud-website
    environment: dev
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neevcloud-website
  namespace: neevai-system
  labels:
    app: neevcloud-website
    environment: dev
spec:
  parentRefs:
    - name: istio-public-gateway
      namespace: istio-system
  hostnames:
    - neevcloud.dev.ai.neevcloud.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: neevcloud-website-service
          port: 3000
