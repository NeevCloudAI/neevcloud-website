<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="diagramTitle">
  <title id="diagramTitle">Decision framework for choosing between Hopper (H100/H200) and Blackwell (B200/GB200) for an AI inference workload</title>
  <rect x="0" y="0" width="900" height="480" fill="#000000"/>

  <!-- Node 1: question -->
  <rect x="300" y="20" width="300" height="70" rx="10" fill="#022C3C" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="600">Does the model + KV cache fit on</text>
  <text x="450" y="70" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="600">H100/H200 with headroom to spare?</text>

  <!-- Arrow to Yes (left) -->
  <line x1="360" y1="90" x2="200" y2="160" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="200,160 210,152 213,164" fill="#59D8A7"/>
  <text x="255" y="120" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#59D8A7" font-weight="600">Yes</text>

  <!-- Arrow to No (right) -->
  <line x1="540" y1="90" x2="700" y2="160" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="700,160 690,164 693,152" fill="#59D8A7"/>
  <text x="645" y="120" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#59D8A7" font-weight="600">No</text>

  <!-- Node 2: stay on Hopper -->
  <rect x="60" y="165" width="280" height="80" rx="10" fill="#00A78B" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="200" y="198" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#000000" font-weight="700">Stay on Hopper</text>
  <text x="200" y="220" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">Rent H100/H200 hours; cheaper</text>
  <text x="200" y="236" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">tokens for workloads that fit today</text>

  <!-- Node 3: what's the wall -->
  <rect x="560" y="165" width="290" height="80" rx="10" fill="#005150" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="705" y="198" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="700">What's the binding constraint?</text>
  <text x="705" y="220" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">Memory capacity, or attention</text>
  <text x="705" y="236" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">latency at long context?</text>

  <!-- Arrow to memory branch -->
  <line x1="660" y1="245" x2="560" y2="330" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="560,330 570,323 573,335" fill="#59D8A7"/>
  <text x="580" y="290" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#59D8A7" font-weight="600">Memory</text>

  <!-- Arrow to latency branch -->
  <line x1="760" y1="245" x2="830" y2="330" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="830,330 820,325 826,315" fill="#59D8A7"/>
  <text x="825" y="290" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#59D8A7" font-weight="600">Latency</text>

  <!-- Node 4: move to B200 -->
  <rect x="420" y="335" width="270" height="90" rx="10" fill="#59D8A7" stroke="#EAF4F4" stroke-width="1.5"/>
  <text x="555" y="368" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#000000" font-weight="700">Move to B200</text>
  <text x="555" y="390" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">Bigger HBM3e pool removes a</text>
  <text x="555" y="406" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">node split; native FP4 for throughput</text>

  <!-- Node 5: GB200 NVL72 -->
  <rect x="700" y="335" width="180" height="90" rx="10" fill="#022C3C" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="790" y="368" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="700">GB200 NVL72</text>
  <text x="790" y="390" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">Rack-scale NVLink</text>
  <text x="790" y="406" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">domain, not one chip</text>
</svg>
