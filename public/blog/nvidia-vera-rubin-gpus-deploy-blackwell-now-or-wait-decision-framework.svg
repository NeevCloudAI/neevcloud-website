<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="diagramTitle">
  <title id="diagramTitle">Decision framework for deploying on Blackwell now versus waiting for NVIDIA Vera Rubin, branching on deployment timeline and memory bandwidth constraints</title>
  <rect x="0" y="0" width="900" height="480" fill="#000000"/>

  <!-- Node 1: question -->
  <rect x="290" y="20" width="320" height="70" rx="10" fill="#022C3C" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="600">When does your deployment</text>
  <text x="450" y="70" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="600">realistically start?</text>

  <!-- Arrow to 2026 (left) -->
  <line x1="360" y1="90" x2="200" y2="160" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="200,160 210,152 213,164" fill="#59D8A7"/>
  <text x="255" y="120" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#59D8A7" font-weight="600">2026</text>

  <!-- Arrow to 2027+ (right) -->
  <line x1="540" y1="90" x2="700" y2="160" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="700,160 690,164 693,152" fill="#59D8A7"/>
  <text x="655" y="120" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#59D8A7" font-weight="600">2027+</text>

  <!-- Node 2: deploy now -->
  <rect x="60" y="165" width="280" height="80" rx="10" fill="#00A78B" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="200" y="198" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#000000" font-weight="700">Deploy on Blackwell now</text>
  <text x="200" y="220" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">Rubin's first units go to eight</text>
  <text x="200" y="236" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">cloud partners, not open orders</text>

  <!-- Node 3: what's the constraint -->
  <rect x="560" y="165" width="290" height="80" rx="10" fill="#005150" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="705" y="198" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#EAF4F4" font-weight="700">What's the binding constraint?</text>
  <text x="705" y="220" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">Memory bandwidth, or power</text>
  <text x="705" y="236" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">and cooling not yet built?</text>

  <!-- Arrow to bandwidth branch -->
  <line x1="660" y1="245" x2="560" y2="330" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="560,330 570,323 573,335" fill="#59D8A7"/>
  <text x="580" y="290" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#59D8A7" font-weight="600">Bandwidth</text>

  <!-- Arrow to power/cooling branch -->
  <line x1="760" y1="245" x2="830" y2="330" stroke="#59D8A7" stroke-width="2"/>
  <polygon points="830,330 820,325 826,315" fill="#59D8A7"/>
  <text x="825" y="290" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#59D8A7" font-weight="600">Power</text>

  <!-- Node 4: wait for Rubin -->
  <rect x="420" y="335" width="270" height="90" rx="10" fill="#59D8A7" stroke="#EAF4F4" stroke-width="1.5"/>
  <text x="555" y="368" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#000000" font-weight="700">Wait for Rubin</text>
  <text x="555" y="390" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">288GB HBM4 and 22 TB/s clear a</text>
  <text x="555" y="406" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#000000">long-context bottleneck Blackwell can't</text>

  <!-- Node 5: build once for Rubin density -->
  <rect x="700" y="335" width="180" height="90" rx="10" fill="#022C3C" stroke="#59D8A7" stroke-width="1.5"/>
  <text x="790" y="360" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="14" fill="#EAF4F4" font-weight="700">Build once</text>
  <text x="790" y="382" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">for Rubin's density,</text>
  <text x="790" y="400" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="13" fill="#EAF4F4">skip a retrofit</text>
</svg>
